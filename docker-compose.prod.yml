version: "3.7"

services:
  db:
    image: postgres:15
    volumes:
      - bizguardian_pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: bizguardian_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      POSTGRES_DB: bizguardian_crm
    networks:
      - bizguardian_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  api:
    image: ${DOCKER_IMAGE:-bizguardian-api:latest}
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://bizguardian_admin:${DB_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@db:5432/bizguardian_crm
      - CORS_ORIGIN=${CORS_ORIGIN:-https://marinhoponci.com}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-bizguardian2025}
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-resend}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-info@marinhoponci.com}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_EBOOK_PRICE_ID=${STRIPE_EBOOK_PRICE_ID:-}
      - PUBLIC_URL=https://marinhoponci.com
    volumes:
      - /root/bizguardian/public_media:/usr/src/app/public_media
      - /root/bizguardian/private_assets:/usr/src/app/private_assets
    networks:
      - bizguardian_internal
      - mycom
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.bizguardian-api.rule=Host(`api.marinhoponci.com`)"
        - "traefik.http.routers.bizguardian-api.entrypoints=websecure"
        - "traefik.http.routers.bizguardian-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.bizguardian-api.loadbalancer.server.port=3001"
        - "traefik.docker.network=mycom"

volumes:
  bizguardian_pgdata:


networks:
  bizguardian_internal:
    driver: overlay
  mycom:
    external: true
    name: mycom
