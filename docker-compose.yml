services:
  db:
    image: postgres:15
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_USER: bizguardian_admin
      POSTGRES_PASSWORD: admin_password_123
      POSTGRES_DB: bizguardian_crm
    ports:
      - "5433:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://bizguardian_admin:admin_password_123@db:5432/bizguardian_crm
      - CORS_ORIGIN=http://localhost:5173
      - ADMIN_USER=admin
      - ADMIN_PASS=bizguardian2025
    depends_on:
      - db

volumes:
  crm_pgdata:
